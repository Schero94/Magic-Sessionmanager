name: Test & Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Verify Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # package.json engines: ^22.22.2 || >=24.15.0
        node-version: ['22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run regression test suite
        run: npm test

      - name: Dependency gate unit tests
        run: node --test .github/scripts/dependency-gate.test.mjs

      - name: Showcase script unit tests
        run: node --test .github/scripts/showcase.test.mjs

      - name: Admin StrictMode tests (React 18)
        run: npm run test:admin

      - name: Type checks
        run: |
          npm run test:ts:front
          npm run test:ts:back

      - name: Build plugin
        run: npm run build

      - name: Verify plugin integrity
        run: npm run verify

      - name: Verify server runtime bundle
        run: npm run verify:runtime

      - name: Verify build output
        run: |
          test -f dist/admin/index.js
          test -f dist/admin/index.mjs
          test -f dist/server/index.js
          test -f dist/server/index.mjs

      - name: Check file structure
        run: |
          test -d admin/src
          test -d server/src
          test -f package.json
          test -f .releaserc.json
          test -f README.md
          test -f LICENSE

  react-19:
    # Informational: the peer range is React ^18, like the Strapi 5 admin, and stays so. This job
    # runs the admin StrictMode tests against React 19 (RFC strapi/strapi#25739) to see problems
    # before Strapi moves; a failure here does not block a pull request.
    name: Admin StrictMode tests on React 19 (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install React 19 (not saved)
        run: npm install --no-save --legacy-peer-deps --ignore-scripts react@19 react-dom@19

      - name: Show installed React version
        run: node -p "'react ' + require('react/package.json').version + ', react-dom ' + require('react-dom/package.json').version"

      - name: Admin StrictMode tests (React 19)
        run: npm run test:admin

  multi-process:
    name: Multi-process coordination (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: magic_sessionmanager_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Eight processes against SQLite and PostgreSQL
        env:
          MSM_TEST_PG_URL: postgres://strapi:strapi@localhost:5432/magic_sessionmanager_ci
          MSM_CONCURRENCY_REQUIRE: sqlite,postgres
        run: npm run test:concurrency

  admin-sessions:
    name: Real Strapi HTTP suites (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: magic_sessionmanager_http
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # The suites boot the Strapi version from this repository's devDependencies
      # (no separate host app) and fail instead of skipping when it is missing.
      - name: Admin panel sessions on SQLite
        env:
          SESSION_HTTP_REQUIRED: '1'
          SESSION_HTTP_STRAPI_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: node --test tests/isolated-admin-sessions-http.test.js

      - name: Admin panel sessions on PostgreSQL
        env:
          SESSION_HTTP_REQUIRED: '1'
          SESSION_HTTP_STRAPI_NODE_MODULES: ${{ github.workspace }}/node_modules
          SESSION_HTTP_DB: postgres
          MSM_TEST_PG_URL: postgres://strapi:strapi@localhost:5432/magic_sessionmanager_http
        run: node --test tests/isolated-admin-sessions-http.test.js

      - name: Admin sign-in history and activity (no proxy and trusted proxy)
        env:
          SESSION_HTTP_REQUIRED: '1'
          SESSION_HTTP_STRAPI_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: |
          node --test tests/isolated-admin-activity-http.test.js
          ADMIN_ACTIVITY_PROXY=1 node --test tests/isolated-admin-activity-http.test.js

      - name: Existing HTTP access suite (legacy and refresh mode)
        env:
          SESSION_HTTP_REQUIRED: '1'
          SESSION_HTTP_STRAPI_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: |
          node --test tests/isolated-http-access.test.js
          SESSION_HTTP_MODE=refresh node --test tests/isolated-http-access.test.js

  strapi-floor:
    name: Real Strapi HTTP suites on the peer floor (Strapi 5.50.0)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # package.json peers: @strapi/strapi and @strapi/plugin-users-permissions ^5.50.0.
      # 5.50.0 added sessionManager listSessions/revokeSessionById and admin session
      # metadata; the suites below fail on 5.49.0 and older.
      - name: Install the Strapi 5.50.0 floor host
        run: |
          mkdir -p "$RUNNER_TEMP/strapi-floor"
          cd "$RUNNER_TEMP/strapi-floor"
          echo '{"name":"strapi-floor-host","version":"0.0.0","private":true}' > package.json
          npm install --no-audit --no-fund --legacy-peer-deps @strapi/strapi@5.50.0 @strapi/plugin-users-permissions@5.50.0 better-sqlite3@13 jsonwebtoken
          for pkg in strapi core admin plugin-users-permissions; do
            version=$(node -p "require('./node_modules/@strapi/$pkg/package.json').version")
            echo "@strapi/$pkg $version"
            test "$version" = 5.50.0
          done

      - name: HTTP suites on Strapi 5.50.0
        env:
          SESSION_HTTP_REQUIRED: '1'
          SESSION_HTTP_STRAPI_NODE_MODULES: ${{ runner.temp }}/strapi-floor/node_modules
        run: |
          node --test tests/isolated-http-access.test.js
          SESSION_HTTP_MODE=refresh node --test tests/isolated-http-access.test.js
          SESSION_HTTP_FALLBACK=1 node --test tests/isolated-http-access.test.js
          node --test tests/isolated-admin-sessions-http.test.js
          node --test tests/isolated-native-capture-http.test.js
          node --test tests/isolated-admin-activity-http.test.js
