name: Test & Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Verify Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # package.json engines: ^22.22.2 || >=24.15.0
        node-version: ['22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run regression test suite
        run: npm test

      - name: Type checks
        run: |
          npm run test:ts:front
          npm run test:ts:back

      - name: Build plugin
        run: npm run build

      - name: Verify plugin integrity
        run: npm run verify

      - name: Verify server runtime bundle
        run: npm run verify:runtime

      - name: Verify build output
        run: |
          test -f dist/admin/index.js
          test -f dist/admin/index.mjs
          test -f dist/server/index.js
          test -f dist/server/index.mjs

      - name: Check file structure
        run: |
          test -d admin/src
          test -d server/src
          test -f package.json
          test -f .releaserc.json
          test -f README.md
          test -f LICENSE
